name: nightly-release

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Force a nightly tag even without new commits since the previous nightly.
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      base_version: ${{ steps.version.outputs.base_version }}
      latest_stable_tag: ${{ steps.version.outputs.latest_stable_tag }}
      latest_nightly_tag: ${{ steps.version.outputs.latest_nightly_tag }}
      commits_since_nightly: ${{ steps.version.outputs.commits_since_nightly }}
      head_sha: ${{ steps.version.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compute Nightly Version
        id: version
        shell: bash
        run: |
          force_flag=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.force }}" == "true" ]]; then
            force_flag="--force"
          fi

          python scripts/nightly_version.py $force_flag --format github > nightly.env
          cat nightly.env >> "$GITHUB_OUTPUT"

      - name: Show Decision
        shell: bash
        run: |
          echo "should_release=${{ steps.version.outputs.should_release }}"
          echo "tag=${{ steps.version.outputs.tag }}"
          echo "base_version=${{ steps.version.outputs.base_version }}"
          echo "latest_stable_tag=${{ steps.version.outputs.latest_stable_tag }}"
          echo "latest_nightly_tag=${{ steps.version.outputs.latest_nightly_tag }}"
          echo "commits_since_nightly=${{ steps.version.outputs.commits_since_nightly }}"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    env:
      TB_PULL_REQUEST_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
      USERNAME: TrenchBroom
      VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg
      FEED_URL: https://nuget.pkg.github.com/TrenchBroom/index.json
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/TrenchBroom/index.json,readwrite"
      MONO_GAC_PREFIX: "$HOMEBREW_PREFIX"
      NIGHTLY_TAG: ${{ needs.prepare.outputs.tag }}
      NIGHTLY_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}
          submodules: 'recursive'

      - name: Create Local Nightly Tag
        shell: bash
        run: |
          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/${NIGHTLY_TAG}" >/dev/null; then
            git tag "${NIGHTLY_TAG}" "${NIGHTLY_HEAD_SHA}"
          fi

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'

      - name: Windows - Bootstrap vcpkg
        if: ${{ matrix.os == 'windows-2022' }}
        shell: pwsh
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.bat

      - name: Windows - Install dependencies
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          Invoke-WebRequest 'https://github.com/jgm/pandoc/releases/download/2.11.3.1/pandoc-2.11.3.1-windows-x86_64.zip' -OutFile 'pandoc.zip'
          if ("668A62A8990DEB2753753DF0C8D3F1BE567026FE" -ne (Get-FileHash -Path 'pandoc.zip' -Algorithm SHA1).Hash) { exit }
          7z x pandoc.zip -o'.'
          $tb_pandoc_path = "$(pwd)\pandoc-2.11.3.1"
          echo "Pandoc path: $tb_pandoc_path"
          echo "$tb_pandoc_path" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Windows - Add NuGet sources
        if: ${{ matrix.os == 'windows-2022' }}
        shell: pwsh
        run: |
          .$(${{ env.VCPKG_EXE }} fetch nuget) `
            sources add `
            -Source "${{ env.FEED_URL }}" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "${{ env.USERNAME }}" `
            -Password "${{ secrets.GITHUB_TOKEN }}"
          .$(${{ env.VCPKG_EXE }} fetch nuget) `
            setapikey "${{ secrets.GITHUB_TOKEN }}" `
            -Source "${{ env.FEED_URL }}"

      - name: Windows - Build
        if: ${{ matrix.os == 'windows-2022' }}
        run: cmd.exe /c CI-windows.bat

      - name: Windows - Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'windows-2022' }}
        with:
          name: nightly-${{ matrix.os }}
          path: |
            cmakebuild/*.zip
            cmakebuild/*.zip.md5

      - name: Linux - Bootstrap vcpkg
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        shell: bash
        run: |
          ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh

      - name: Linux - Install dependencies
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt update
          sudo apt install gcc-13 g++-13 build-essential libxi-dev libxrandr-dev libxxf86vm-dev freeglut3-dev mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev libglm-dev pandoc cmake p7zip-full ninja-build xvfb libglew-dev libfreeimage-dev libfreetype6-dev libtinyxml2-dev libassimp-dev libfuse2

      - name: Linux - Add NuGet sources
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        shell: bash
        run: |
          mono `${{ env.VCPKG_EXE }} fetch nuget | tail -n 1` \
            sources add \
            -Source "${{ env.FEED_URL }}" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "${{ env.USERNAME }}" \
            -Password "${{ secrets.GITHUB_TOKEN }}"
          mono `${{ env.VCPKG_EXE }} fetch nuget | tail -n 1` \
            setapikey "${{ secrets.GITHUB_TOKEN }}" \
            -Source "${{ env.FEED_URL }}"

      - name: Linux - Set compiler version
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Linux - Build
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          ./CI-linux.sh

      - name: Linux - Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        with:
          name: nightly-${{ matrix.os }}
          path: |
            cmakebuild/*.zip
            cmakebuild/*.md5

      - name: macOS - Switch to Xcode 26
        if: ${{ matrix.os == 'macos-15' }}
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: macOS - Bootstrap vcpkg
        if: ${{ matrix.os == 'macos-15' }}
        shell: bash
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh

      - name: macOS - Set build env
        if: ${{ matrix.os == 'macos-15' }}
        run: |
          echo "TB_ENABLE_ASAN=0" >> $GITHUB_ENV
          echo "TB_ENABLE_TSAN=0" >> $GITHUB_ENV
          echo "TB_ENABLE_UBSAN=0" >> $GITHUB_ENV
          echo "TB_SIGN_MAC_BUNDLE=false" >> $GITHUB_ENV

      - name: macOS - Install dependencies
        if: ${{ matrix.os == 'macos-15' }}
        run: brew install p7zip pandoc ninja autoconf automake mono

      - name: macOS - Add NuGet sources
        if: ${{ matrix.os == 'macos-15' }}
        shell: bash
        run: |
          mono `${{ env.VCPKG_EXE }} fetch nuget | tail -n 1` \
            sources add \
            -Source "${{ env.FEED_URL }}" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "${{ env.USERNAME }}" \
            -Password "${{ secrets.GITHUB_TOKEN }}"
          mono `${{ env.VCPKG_EXE }} fetch nuget | tail -n 1` \
            setapikey "${{ secrets.GITHUB_TOKEN }}" \
            -Source "${{ env.FEED_URL }}"

      - name: macOS - Build
        if: ${{ matrix.os == 'macos-15' }}
        run: ./CI-macos.sh

      - name: macOS - Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'macos-15' }}
        with:
          name: nightly-${{ matrix.os }}
          path: |
            cmakebuild/*.zip
            cmakebuild/*.md5

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.head_sha }}
          submodules: 'recursive'

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create and Push Nightly Tag
        shell: bash
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          head_sha="${{ needs.prepare.outputs.head_sha }}"
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${tag}" "${head_sha}"
            git push origin "${tag}"
          fi

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Nightly ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.md5
          fail_on_unmatched_files: true

  no-changes:
    needs: prepare
    if: needs.prepare.outputs.should_release != 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Skip Nightly
        run: echo "No commits since previous nightly; skipping tag creation."
